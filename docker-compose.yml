services:
  postgres:
    image: postgres:16-alpine
    container_name: chatbot_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgraduate_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgraduate_rag}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: chatbot_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "6333:6333"
    restart: unless-stopped

  backend:
    image: ghcr.io/${IMAGE_NAMESPACE:-vietaimem}/chatbotrag-backend:${IMAGE_TAG:-latest}
    build: ./backend
    container_name: chatbot_backend
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Postgraduate Information Assistant}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgraduate_rag}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-postgraduate_documents}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string-in-production}
      CORS_ORIGINS: '["http://localhost:3000"]'
      DOCUMENT_STORAGE_PATH: /app/storage/documents
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-30}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash-bge-m3-v1}
      RERANKER_MODEL: ${RERANKER_MODEL:-lexical}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}
    volumes:
      - document_storage:/app/storage/documents
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: ghcr.io/${IMAGE_NAMESPACE:-vietaimem}/chatbotrag-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
    container_name: chatbot_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  document_storage:
